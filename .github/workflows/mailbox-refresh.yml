name: Mailbox Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailbox-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh connected mailboxes
        env:
          CAREEROS_BASE_URL: ${{ secrets.CAREEROS_BASE_URL }}
          CAREEROS_WORKER_SECRET: ${{ secrets.CAREEROS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CAREEROS_BASE_URL}"
          test -n "${CAREEROS_WORKER_SECRET}"
          curl --fail-with-body --silent --show-error             --retry 3 --retry-delay 5 --retry-all-errors             -X POST             -H "x-careeros-worker-secret: ${CAREEROS_WORKER_SECRET}"             "${CAREEROS_BASE_URL%/}/api/workers/mailbox-refresh?limit=25"
