name: Mailbox Refresh

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailbox-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CAREEROS_BASE_URL: ${{ secrets.CAREEROS_BASE_URL }}
      CAREEROS_WORKER_SECRET: ${{ secrets.CAREEROS_WORKER_SECRET }}
    steps:
      - name: Refresh connected mailboxes
        if: env.CAREEROS_BASE_URL != '' && env.CAREEROS_WORKER_SECRET != ''
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors             -X POST             -H "x-careeros-worker-secret: ${CAREEROS_WORKER_SECRET}"             "${CAREEROS_BASE_URL%/}/api/workers/mailbox-refresh?limit=25"
      - name: Record mailbox production configuration status
        if: env.CAREEROS_BASE_URL == '' || env.CAREEROS_WORKER_SECRET == ''
        run: |
          {
            echo "## Mailbox production configuration"
            echo ""
            echo "Mailbox refresh was not called because CAREEROS_BASE_URL and/or CAREEROS_WORKER_SECRET is not configured."
            echo "Repository CI independently validates lint, typecheck, and build."
          } >> "$GITHUB_STEP_SUMMARY"

